name: GitHub repository metrics and README refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'docs/metrics/**'
      - 'docs/history/**'
      - '.github/workflows/github-metrics.yml'

permissions:
  contents: write

concurrency:
  group: github-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refresh public metrics, optional traffic, history chart and README
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TRAFFIC_TOKEN: ${{ secrets.WHISKAY_GITHUB_TRAFFIC_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: python3 .github/scripts/update_github_metrics.py
      - name: Commit metrics snapshot if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/metrics/github-metrics.json docs/metrics/history.json
          if git diff --cached --quiet; then
            echo 'Metrics are unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m "chore(metrics): refresh GitHub traffic and update timestamp [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
