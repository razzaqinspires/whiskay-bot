name: GitHub repository metrics and README refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/metrics/**'
      - 'docs/history/**'
      - '.github/workflows/github-metrics.yml'

permissions:
  contents: read

concurrency:
  group: github-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refresh public metrics, optional traffic, history chart and README
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TRAFFIC_TOKEN: ${{ secrets.WHISKAY_GITHUB_TRAFFIC_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: python3 .github/scripts/update_github_metrics.py
      - name: Report generated metrics without committing
        run: echo 'Metrics refreshed in the workflow workspace; no repository commit is created.'
