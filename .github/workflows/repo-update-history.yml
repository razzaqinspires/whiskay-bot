name: Repository update history

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/history/updates.jsonl'
      - 'docs/history/README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whiskay-automation-branch
  cancel-in-progress: false

jobs:
  append-update-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Append minimal source-update metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_TIME: ${{ github.event.head_commit.timestamp }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p docs/history
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path = 'docs/history/updates.jsonl'
          raw_time = os.environ.get('SERVER_TIME', '').strip()
          # workflow_dispatch and some push payloads do not provide head_commit.timestamp.
          # Fall back to the pushed commit timestamp before using runner UTC time.
          if not raw_time:
              import subprocess
              sha = os.environ.get('SHA', '')
              if sha:
                  try:
                      raw_time = subprocess.check_output(
                          ['git', 'show', '-s', '--format=%cI', sha],
                          text=True, stderr=subprocess.DEVNULL, timeout=5
                      ).strip()
                  except Exception:
                      raw_time = ''
          timestamp = raw_time or datetime.now(timezone.utc).isoformat()
          record = {
              'timestamp': timestamp,
              'event': os.environ.get('EVENT_NAME', 'unknown'),
              'repository': os.environ.get('REPOSITORY', ''),
              'branch': os.environ.get('BRANCH', ''),
              'commit': os.environ.get('SHA', ''),
              'actor': os.environ.get('ACTOR', ''),
              'message': (os.environ.get('COMMIT_MESSAGE', '').splitlines() or [''])[0][:180],
          }
          with open(path, 'a', encoding='utf-8') as f:
              f.write(json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

      - name: Commit update ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/history/updates.jsonl
          if git diff --cached --quiet; then
            echo 'No update metadata to commit.'
            exit 0
          fi
          git commit -m "chore(audit): record repository update metadata [skip ci]"
          git push origin "HEAD:automation" --force
